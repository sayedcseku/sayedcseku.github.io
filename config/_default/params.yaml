# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: indigo

# Theme & Typography (Hugo Blox)
hugoblox:
  theme:
    pack: default
    mode: system
    colors:
      primary: indigo
      secondary: sky
      neutral: slate
  typography:
    font: sans
    size: md
  layout:
    radius: lg
    spacing: spacious
    avatar_shape: circle

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'Md Abu Sayed — Ph.D. Candidate in Computer Science at UNR. Research in maritime intent recognition, simulation-driven AI, and anticipatory intelligent systems.'
    twitter: 'GetResearchDev'
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    blox: "navbar"
    fixed_to_top: true
    show_search: true
    show_theme_chooser: true
    logo:
      text: "Md Abu Sayed"

# Site footer
footer:
  copyright:
    notice: '© {2025} Me. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: false
  privacy_pack:
    enable: false
