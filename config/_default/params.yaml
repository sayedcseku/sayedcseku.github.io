# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: indigo

# Theme & Typography (Hugo Blox)
hugoblox:
  theme:
    pack: default
    mode: system
    colors:
      primary: indigo
      secondary: sky
      neutral: slate
  typography:
    font: sans
    size: md
  layout:
    radius: lg
    spacing: spacious
    avatar_shape: circle

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'Md Abu Sayed — Postdoctoral Researcher at the Center for Digital Cardiovascular Innovations, University of Miami Miller School of Medicine; Ph.D. in Computer Science & Engineering (UNR). Research in cardiovascular AI, medical imaging, deep learning, and joint intent recognition and trajectory prediction.'
    twitter: 'sayedcseku'
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    blox: "navbar"
    fixed_to_top: true
    show_search: true
    show_theme_chooser: true
    logo:
      text: "Md Abu Sayed"

# Site footer
footer:
  copyright:
    notice: '© {year} Md Abu Sayed. All rights reserved.'
    license:
      enable: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: false
  privacy_pack:
    enable: false
